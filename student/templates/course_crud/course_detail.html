{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Course Details</h3>
                </div>

                <div class="card-body p-4">
                    <h4 class="mb-3">{{ object.name|default:"Course Name" }}</h4>

                    <dl class="row mb-4">
                        <dt class="col-sm-3">Code</dt>
                        <dd class="col-sm-9">{{ object.code|default:"N/A" }}</dd>

                        <dt class="col-sm-3">Credits</dt>
                        <dd class="col-sm-9">{{ object.credits|default:"N/A" }}</dd>

                        <dt class="col-sm-3">Description</dt>
                        <dd class="col-sm-9">
                            {{ object.description|default:"No description available." }}
                        </dd>
                    </dl>

                    <div class="d-flex gap-2">
                        <a href="{% url 'course_list' %}" class="btn btn-secondary">Back to List</a>
                        <a href="{% url 'course_update' object.pk %}" class="btn btn-warning">Edit</a>
                        <a href="{% url 'course_delete' object.pk %}" class="btn btn-danger">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
