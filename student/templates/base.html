{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{% static 'js/script.js' %}"></script>
    <link rel="stylesheet"  href="{% static 'css/style.css' %}">
     
    <title>{% block title %}Student Management system{% endblock %}</title>
</head>
<body>
    <header class="hdr">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="/">Home</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}">about us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/student">List</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/Attendance">Attendance</a>
                </li> 
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'course_list' %}">Course List</a>
                </li>
                </ul>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger ms-auto">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </nav>
    </header>
    <div class="col-md-10 p-4">
        {% block content%}

        {% endblock %}
    </div>
    <footer class="bg-light text-center py-3 border-top">
        &copy; 2026 My Website. All Rights Reserved.
    </footer>
</body>
</html>
